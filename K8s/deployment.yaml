apiVersion:apps/v1
kind:Deployment

metadata:
  name:jenkins_devops

spec:
  replicas:2
  selector:
    matchLabels:
      app:jenkins_devops

  template:
    metadata:
      labels:
      app:jenkins_devops

    spec:
    containers:
    - name:jenkins_devops_container
      image:ramram27/jenkins_devops:latest
    
     ports:
      - containerPort:3000
      